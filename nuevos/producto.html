<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Producto | Industrias Autolack SAS</title>
    <link rel="icon" type="image/png" href="../imagenes/icono.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Barlow+Semi+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css"> 
    <link rel="stylesheet" href="productos.css"> 
</head>
<body>

    <header class="main-header product-header">
        <nav class="navbar">
            <div class="nav-col">
                <a href="../index.html" class="btn-back-home">
                    <i class="fa-solid fa-arrow-left"></i> Volver al Inicio
                </a>
            </div>
            <div class="nav-col menu-col">
                <img src="../imagenes/logo.png" alt="Autolack Logo" class="logo-small">
            </div>
            <div class="nav-col"></div> 
        </nav>
    </header>

    <main class="product-detail-page">
        <section class="product-detail-container">
            <div class="container-flex">
                
                <div class="detail-img-box" id="img-dynamic-content">
                    </div>

                <div class="detail-info-content">
                    <h1 id="prod-title">Cargando...</h1>
                    <div class="divider-blue"></div>
                    
                    <div class="description-block">
                        <h3>Descripción General</h3>
                        <p id="prod-desc">Espere un momento...</p>
                    </div>

                    <div class="specs-block">
                        <h3><i class="fa-solid fa-microscope"></i> Especificaciones Técnicas</h3>
                        <ul id="prod-specs-list"></ul>
                    </div>

                    <div class="cta-actions">
                        <a id="whatsapp-link" href="#" target="_blank" class="btn-cotizar">
                            <i class="fa-brands fa-whatsapp"></i> Cotizar este producto
                        </a>
                        <p class="shipping-info"><i class="fa-solid fa-truck-fast"></i> Envíos a todo Antioquia y Colombia.</p>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <footer class="footer-copy">
        <p>&copy; 2026 Industrias Autolack SAS | Calidad y Tecnología en Pinturas</p>
    </footer>

    <script src="detalle.js"></script>
</body>
</html>
